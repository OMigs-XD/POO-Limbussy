<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedra, Papel e Tesoura</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main class="page">
    <header class="title-box">PEDRA PAPEL E TESOURA</header>
    <img class="limbus-logo" src="/static/assets/cropped-limbus_logo_normal.png" alt="Limbus Company">

    <section class="arena" id="arena">
        <div class="scoreboard">
            <div><span>VOCÊ</span><b id="player-score">{{ player_score }}</b></div>
            <em>×</em>
            <div><span>MÁQUINA</span><b id="machine-score">{{ machine_score }}</b></div>
        </div>

        <div class="fighter player" id="player-fighter">
            <div class="fighter-tag"><img id="player-badge" alt=""><span id="player-association">ZWEI</span></div>
            <div class="sprite-wrap"><img id="player-sprite" alt="Ishmael"></div>
            <div class="fighter-name" id="player-name">Ishmael</div>
        </div>

        <div class="fighter machine" id="machine-fighter">
            <div class="fighter-tag"><img id="machine-badge" alt=""><span id="machine-association">ZWEI</span></div>
            <div class="sprite-wrap"><img id="machine-sprite" alt="Ishmael"></div>
            <div class="fighter-name" id="machine-name">Ishmael</div>
        </div>

        <div class="status" id="status">ESCOLHA UMA JOGADA</div>
    </section>

    <section class="choices">
        <button class="choice" data-choice="pedra">
            <span class="logo-circle"><img alt="ZWEI"></span>
            <span>PEDRA</span>
        </button>
        <button class="choice" data-choice="papel">
            <span class="logo-circle"><img alt="SEVEN"></span>
            <span>PAPEL</span>
        </button>
        <button class="choice" data-choice="tesoura">
            <span class="logo-circle"><img alt="SHI"></span>
            <span>TESOURA</span>
        </button>
    </section>
</main>

<div class="black-screen" id="black-screen">
    <div class="overlay-panel">
        <div class="small-title" id="overlay-kicker">RODADA</div>
        <h1 id="overlay-title">...</h1>
        <p id="overlay-text"></p>
        <button id="overlay-button">ESCOLHER NOVAMENTE</button>
    </div>
</div>

<script>
window.GAME_DATA = { characters: {{ characters|tojson }} };
</script>
<script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
